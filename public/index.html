<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>域名信息收集</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-labelledby="title">
        <div class="heading">
          <p class="eyebrow">Authorized Intel</p>
          <h1 id="title">域名信息收集</h1>
          <p class="summary">输入你拥有授权的域名，收集 DNS、网站响应、TLS 证书和少量端口可达性信息。</p>
        </div>

        <form id="collectForm" class="queryBar">
          <label>
            <span>目标域名或 URL</span>
            <input id="targetInput" name="target" type="text" placeholder="example.com" autocomplete="off" required>
          </label>
          <label>
            <span>端口，逗号分隔</span>
            <input id="portsInput" name="ports" type="text" placeholder="80,443,8080,22">
          </label>
          <button id="collectButton" type="submit">开始收集</button>
        </form>

        <div id="status" class="status" role="status"></div>

        <section id="results" class="results" hidden>
          <div class="resultHeader">
            <div>
              <p class="eyebrow">Result</p>
              <h2 id="resultTarget"></h2>
            </div>
            <time id="collectedAt"></time>
          </div>

          <div class="grid">
            <article class="panel">
              <h3>DNS 记录</h3>
              <div id="dnsRecords" class="kvList"></div>
            </article>

            <article class="panel">
              <h3>网站响应</h3>
              <div id="httpRecords" class="stack"></div>
            </article>

            <article class="panel">
              <h3>TLS 证书</h3>
              <div id="tlsRecord" class="kvList"></div>
            </article>

            <article class="panel">
              <h3>端口检查</h3>
              <div id="portRecords" class="ports"></div>
            </article>
          </div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
